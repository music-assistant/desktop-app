<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Assistant</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root,
      :root.light {
        --bg-primary: #f5f5f7;
        --bg-secondary: #ffffff;
        --text-primary: #1d1d1f;
        --text-secondary: #555558;
        --border-color: #d2d2d7;
        --accent-color: #007aff;
        --accent-hover: #0056b3;
        --server-bg: #ffffff;
        --server-hover: #f0f0f5;
      }

      :root.dark {
        --bg-primary: #1c1c1e;
        --bg-secondary: #2c2c2e;
        --text-primary: #f5f5f7;
        --text-secondary: #aeaeb2;
        --border-color: #38383a;
        --accent-color: #0a84ff;
        --accent-hover: #409cff;
        --server-bg: #2c2c2e;
        --server-hover: #3a3a3c;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
      }

      /* Launcher UI */
      #launcher {
        height: 100vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px;
      }

      #launcher .container {
        margin-block: auto;
      }

      #launcher.hidden {
        display: none;
      }

      /* Connecting overlay */
      #connectingOverlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--bg-primary);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      #connectingOverlay.hidden {
        display: none;
      }

      .container {
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      .logo {
        width: 96px;
        height: 96px;
        margin-bottom: 20px;
        border-radius: 20px;
      }

      h1 {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .subtitle {
        color: var(--text-secondary);
        margin-bottom: 32px;
        font-size: 14px;
      }

      .section-title {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        text-align: left;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .server-list {
        background: var(--bg-secondary);
        border-radius: 12px;
        border: 1px solid var(--border-color);
        overflow: hidden;
        margin-bottom: 24px;
      }

      .server-item {
        display: flex;
        align-items: center;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border-color);
        cursor: pointer;
        transition: background 0.15s;
        text-align: left;
      }

      .server-item:last-child {
        border-bottom: none;
      }

      .server-item:hover {
        background: var(--server-hover);
      }

      button.server-item {
        width: 100%;
        background: none;
        border: none;
        font: inherit;
        color: inherit;
        text-align: left;
      }

      .server-icon {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        margin-right: 12px;
        flex-shrink: 0;
      }

      .server-info {
        flex: 1;
        min-width: 0;
      }

      .server-name {
        font-weight: 500;
        font-size: 15px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .server-address {
        color: var(--text-secondary);
        font-size: 12px;
        margin-top: 2px;
      }

      .empty-state {
        padding: 32px 16px;
        color: var(--text-secondary);
      }

      .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid var(--border-color);
        border-top-color: var(--accent-color);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 12px;
      }

      .spinner.large {
        width: 40px;
        height: 40px;
        border-width: 3px;
        margin-bottom: 16px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .manual-input {
        margin-top: 24px;
      }

      .input-group {
        display: flex;
        gap: 8px;
      }

      input[type="text"] {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--bg-secondary);
        color: var(--text-primary);
        font-size: 14px;
      }

      input[type="text"]:focus {
        border-color: var(--accent-color);
      }

      input[type="text"]::placeholder {
        color: var(--text-secondary);
      }

      button {
        padding: 12px 20px;
        background: var(--accent-color);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }

      button:hover {
        background: var(--accent-hover);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .refresh-btn {
        margin-top: 16px;
        background: transparent;
        color: var(--accent-color);
        border: 1px solid var(--border-color);
      }

      .refresh-btn:hover {
        background: var(--server-hover);
      }

      .cancel-btn {
        margin-top: 16px;
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid var(--border-color);
        font-size: 14px;
        padding: 8px 24px;
      }

      .cancel-btn:hover {
        background: var(--server-hover);
        color: var(--text-primary);
      }

      .error {
        color: #ff453a;
        font-size: 13px;
        margin-top: 8px;
        text-align: left;
      }

      .last-server {
        margin-bottom: 24px;
      }

      .last-server .server-item {
        border-radius: 12px;
        border: 1px solid var(--border-color);
      }

      /* Accessibility: visible focus indicators for keyboard navigation only */
      button:focus,
      input:focus,
      select:focus {
        outline: none;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--accent-color);
        outline-offset: 2px;
      }

      /* Cancel button inside the connecting modal: always show its focus
         ring when focused, regardless of the last input method. Focus is
         placed here programmatically when the overlay opens, so a visible
         indicator is essential for sighted users arriving after a mouse
         click — WebKit's :focus-visible heuristic otherwise suppresses it. */
      #cancelConnect:focus {
        outline: 3px solid var(--accent-color);
        outline-offset: 2px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Accessibility: respect reduced motion preference */
      @media (prefers-reduced-motion: reduce) {
        .spinner,
        .spinner.large {
          animation: none;
        }

        .server-item,
        button,
        input[type="text"] {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Connecting overlay (shown during auto-connect) -->
    <div
      id="connectingOverlay"
      class="hidden"
      role="dialog"
      aria-label="Connecting to server"
      data-i18n-aria-label="desktop.launcher.connecting_to_server"
      aria-modal="true"
    >
      <img src="logo.png" alt="Music Assistant" class="logo" />
      <div class="spinner large" aria-hidden="true"></div>
      <p class="subtitle" id="connectingText" data-i18n="desktop.launcher.connecting">
        Connecting...
      </p>
      <button
        id="cancelConnect"
        class="cancel-btn"
        onclick="cancelAutoConnect()"
        data-i18n="common.actions.cancel"
      >
        Cancel
      </button>
    </div>

    <!-- Launcher UI -->
    <div id="launcher" class="hidden">
      <div class="container">
        <header>
          <img src="logo.png" alt="Music Assistant" class="logo" />
          <h1 data-i18n="desktop.app.name">Music Assistant</h1>
          <p class="subtitle" data-i18n="desktop.launcher.select_server">
            Select a server to connect
          </p>
        </header>

        <main>
          <!-- Last used server (if any) -->
          <section
            id="lastServerSection"
            class="last-server"
            style="display: none"
            aria-labelledby="lastServerTitle"
          >
            <p
              class="section-title"
              id="lastServerTitle"
              data-i18n="desktop.launcher.last_connected"
            >
              Last Connected
            </p>
            <div class="server-list">
              <button
                class="server-item"
                id="lastServer"
                onclick="connectToLastServer()"
                aria-label="Connect to previous server"
                data-i18n-aria-label="desktop.launcher.connect_to_previous_server"
              >
                <img src="logo.png" alt="" class="server-icon" />
                <div class="server-info">
                  <div class="server-name" id="lastServerName">-</div>
                  <div class="server-address" id="lastServerAddress">-</div>
                </div>
              </button>
            </div>
          </section>

          <!-- Discovered servers -->
          <section aria-labelledby="discoveredServersTitle">
            <p
              class="section-title"
              id="discoveredServersTitle"
              data-i18n="desktop.launcher.discovered_servers"
            >
              Discovered Servers
            </p>
            <div class="server-list" id="serverList">
              <div class="empty-state" id="loadingState">
                <div class="spinner" aria-hidden="true"></div>
                <p data-i18n="desktop.launcher.searching_for_servers">Searching for servers...</p>
              </div>
            </div>

            <button
              class="refresh-btn"
              onclick="discoverServers()"
              data-i18n="common.actions.refresh"
            >
              Refresh
            </button>
          </section>

          <!-- Manual input -->
          <section class="manual-input" aria-labelledby="manualConnectionTitle">
            <p
              class="section-title"
              id="manualConnectionTitle"
              data-i18n="desktop.launcher.manual_connection"
            >
              Manual Connection
            </p>
            <div class="input-group">
              <input
                type="text"
                id="manualAddress"
                placeholder="http://192.168.1.100:8095"
                aria-label="Server address"
                data-i18n-aria-label="desktop.launcher.server_address"
              />
              <button onclick="connectManual()" data-i18n="common.actions.connect">Connect</button>
            </div>
            <p class="error" id="errorMsg" role="alert" style="display: none"></p>
            <div id="recoveryActions" style="display: none">
              <button
                type="button"
                id="retryConnection"
                data-i18n="desktop.launcher.retry_connection"
              >
                Retry
              </button>
              <button type="button" id="editAddress" data-i18n="desktop.launcher.edit_address">
                Edit address
              </button>
            </div>
          </section>

          <div
            role="status"
            aria-live="polite"
            aria-atomic="true"
            id="serverStatus"
            class="sr-only"
          ></div>
        </main>
      </div>
    </div>

    <script src="i18n.js"></script>
    <script src="logging.js"></script>
    <script>
      let autoConnectAttempted = false;
      let connectAttemptId = 0;
      let activeNavigationToken = null;
      // Detect dark mode
      if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
        document.documentElement.classList.toggle("dark", e.matches);
      });

      // Tauri invoke helper
      async function invoke(cmd, args) {
        if (window.__TAURI__) {
          return window.__TAURI__.core.invoke(cmd, args);
        }
        throw new Error("Tauri not available");
      }

      async function loadI18n() {
        initI18n(await invoke("get_i18n_bundle"));
        applyTranslations();
      }

      // Load last server from settings
      async function loadLastServer() {
        try {
          const settings = await invoke("get_settings");
          const lastUrl = settings.last_server_url;
          if (lastUrl) {
            const serverName = settings.last_server_name || t("desktop.launcher.previous_server");

            document.getElementById("lastServerSection").style.display = "block";
            document.getElementById("lastServerName").textContent = serverName;
            document.getElementById("lastServerAddress").textContent = lastUrl;
            document.getElementById("lastServer").dataset.url = lastUrl;
            document.getElementById("lastServer").dataset.name = serverName;
            document
              .getElementById("lastServer")
              .setAttribute(
                "aria-label",
                t("desktop.launcher.connect_to_server_at", serverName, lastUrl)
              );

            return { url: lastUrl, name: serverName };
          }
        } catch (e) {
          console.log("No last server found:", redactDiagnostic(e));
        }
        return null;
      }

      // Try to auto-connect to last server. connectToServer owns the preflight,
      // timeout, and overlay; an unreachable last server returns to the launcher
      // with the same visible error and retry/edit actions as a manual attempt.
      async function tryAutoConnect() {
        if (autoConnectAttempted) return false;
        autoConnectAttempted = true;

        const lastServer = await loadLastServer();
        if (!lastServer) {
          return false;
        }

        return await connectToServer(lastServer.url, lastServer.name);
      }

      function isStaleConnectAttempt(attemptId) {
        return attemptId !== connectAttemptId;
      }

      function cancelNavigationToken(generation) {
        if (generation !== null) {
          invoke("cancel_initial_navigation", { generation }).catch(() => {});
        }
      }

      // Invalidate this attempt even when its native reservation is still in flight.
      function cancelAutoConnect() {
        window.stop();
        connectAttemptId += 1;
        cancelNavigationToken(activeNavigationToken);
        activeNavigationToken = null;
        document.getElementById("connectingOverlay").classList.add("hidden");
        document.getElementById("launcher").classList.remove("hidden");
        document.getElementById("manualAddress").focus();
        loadLastServer();
        discoverServers();
      }

      // Dismiss the connecting overlay on Escape, matching the
      // conventional modal dialog pattern.
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        const overlay = document.getElementById("connectingOverlay");
        if (overlay && !overlay.classList.contains("hidden")) {
          e.preventDefault();
          cancelAutoConnect();
        }
      });

      // Connect to last server (manual click)
      function connectToLastServer() {
        const serverEl = document.getElementById("lastServer");
        const url = serverEl.dataset.url;
        const name = serverEl.dataset.name || null;
        if (url) {
          connectToServer(url, name);
        }
      }

      // Discover servers via mDNS
      async function discoverServers() {
        const serverList = document.getElementById("serverList");
        serverList.innerHTML = `
                <div class="empty-state" id="loadingState">
                    <div class="spinner" aria-hidden="true"></div>
                    <p>${t("desktop.launcher.searching_for_servers")}</p>
                </div>
            `;
        document.getElementById("serverStatus").textContent = t(
          "desktop.launcher.searching_for_servers"
        );

        try {
          const servers = await invoke("discover_servers", { timeoutSecs: 5 });

          if (servers.length === 0) {
            serverList.innerHTML = `
                        <div class="empty-state">
                            <p>${t("desktop.launcher.no_servers_found")}</p>
                        </div>
                    `;
            document.getElementById("serverStatus").textContent = t(
              "desktop.launcher.no_servers_found"
            );
          } else {
            serverList.innerHTML = servers
              .map(
                (server, index) => `
                        <button class="server-item" data-server-index="${index}">
                            <img src="logo.png" alt="" class="server-icon">
                            <div class="server-info">
                                <div class="server-name">${escapeHtml(server.name)}</div>
                                <div class="server-address">${escapeHtml(server.url)}</div>
                            </div>
                        </button>
                    `
              )
              .join("");
            // Bind click handlers via JS to avoid inline handler injection
            // Set aria-label programmatically using setAttribute (safe from injection)
            serverList.querySelectorAll("[data-server-index]").forEach((el) => {
              const server = servers[parseInt(el.dataset.serverIndex)];
              el.setAttribute(
                "aria-label",
                t("desktop.launcher.connect_to_server_at", server.name, server.url)
              );
              el.addEventListener("click", () => connectToServer(server.url, server.name));
            });
            document.getElementById("serverStatus").textContent =
              servers.length === 1
                ? t("desktop.launcher.found_servers_one", servers.length)
                : t("desktop.launcher.found_servers_other", servers.length);
          }
        } catch (e) {
          serverList.innerHTML = `
                    <div class="empty-state">
                        <p>${t("desktop.launcher.error_discovering_servers")}</p>
                    </div>
                `;
          document.getElementById("serverStatus").textContent = t(
            "desktop.launcher.error_discovering_servers"
          );
          console.error("Discovery failed:", redactDiagnostic(e));
        }
      }

      // Escape HTML to prevent XSS
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function showConnectionError(reason) {
        const keys = {
          address: "invalid_address_message",
          connection: "connection_failed_message_generic",
          server: "not_music_assistant_message",
          timeout: "page_load_timeout_message",
        };
        const errorMsg = document.getElementById("errorMsg");
        errorMsg.textContent = t(`desktop.launcher.${keys[reason] || keys.connection}`);
        errorMsg.style.display = "block";
        document.getElementById("serverStatus").textContent = errorMsg.textContent;
      }

      function offerRetry(url, name) {
        const actions = document.getElementById("recoveryActions");
        actions.style.display = "block";
        document.getElementById("retryConnection").onclick = () => connectToServer(url, name);
        document.getElementById("editAddress").onclick = () => {
          const input = document.getElementById("manualAddress");
          input.value = url;
          input.focus();
          input.select();
          actions.style.display = "none";
        };
        actions.scrollIntoView({ block: "nearest" });
      }

      // Connect to a server - navigate directly (no iframe).
      // Returns true if navigation was committed, false if the attempt failed.
      // Every failed attempt, automatic or manual, shows an inline error with
      // retry and edit-address actions.
      async function connectToServer(url, serverName = null) {
        // Ensure URL has protocol
        if (!url.startsWith("http://") && !url.startsWith("https://")) {
          url = "http://" + url;
        }

        window.stop();
        const attemptId = (connectAttemptId += 1);
        cancelNavigationToken(activeNavigationToken);
        activeNavigationToken = null;

        // Show connecting overlay
        document.getElementById("launcher").classList.add("hidden");
        document.getElementById("connectingOverlay").classList.remove("hidden");
        document.getElementById("connectingText").textContent = t(
          "desktop.launcher.connecting_to_server"
        );
        document.getElementById("cancelConnect").focus();
        document.getElementById("serverStatus").textContent = t(
          "desktop.launcher.connecting_to_server"
        );

        let generation = null;
        let selectedUrl;
        try {
          generation = await invoke("reserve_initial_navigation");
          if (isStaleConnectAttempt(attemptId)) {
            cancelNavigationToken(generation);
            return false;
          }
          activeNavigationToken = generation;
          selectedUrl = await invoke("begin_initial_navigation", {
            generation,
            url,
            name: serverName,
          });
        } catch (e) {
          if (isStaleConnectAttempt(attemptId)) {
            cancelNavigationToken(generation);
            return false;
          }
          cancelNavigationToken(generation);
          activeNavigationToken = null;
          console.warn("[Launcher] Initial connection failed:", String(e));
          document.getElementById("connectingOverlay").classList.add("hidden");
          document.getElementById("launcher").classList.remove("hidden");
          document.getElementById("serverStatus").textContent = t(
            "desktop.launcher.connection_failed"
          );
          showConnectionError(String(e));
          offerRetry(url, serverName);
          return false;
        }

        if (isStaleConnectAttempt(attemptId)) {
          cancelNavigationToken(generation);
          return false;
        }

        window.location.replace(selectedUrl);
        return true;
      }

      // Manual connection
      function connectManual() {
        const input = document.getElementById("manualAddress");
        const errorMsg = document.getElementById("errorMsg");
        let url = input.value.trim();

        if (!url) {
          errorMsg.textContent = t("desktop.launcher.enter_server_address_error");
          errorMsg.style.display = "block";
          return;
        }

        errorMsg.style.display = "none";
        connectToServer(url);
      }

      // Allow Enter key in manual input
      document.getElementById("manualAddress").addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          connectManual();
        }
      });

      // Initialize
      async function init() {
        try {
          await loadI18n();

          const recovery = window.__MA_INITIAL_RECOVERY__ || null;
          if (recovery) {
            autoConnectAttempted = true;
            document.getElementById("manualAddress").value = recovery.url;
            document.getElementById("launcher").classList.remove("hidden");
            showConnectionError(recovery.reason);
            offerRetry(recovery.url, recovery.name);
            await loadLastServer();
            discoverServers();
            document.getElementById("recoveryActions").scrollIntoView({ block: "nearest" });
            return;
          }

          // Try auto-connect first
          const connected = await tryAutoConnect();

          if (!connected) {
            // Show launcher and discover servers
            document.getElementById("launcher").classList.remove("hidden");
            await loadLastServer();
            discoverServers();
          }
        } catch (e) {
          console.error("[Launcher] Initialization failed:", redactDiagnostic(e));
          // Always show launcher on error
          document.getElementById("connectingOverlay").classList.add("hidden");
          document.getElementById("launcher").classList.remove("hidden");
        }
      }

      // Start init when Tauri is ready, with a fallback timeout
      async function startInit() {
        // Wait for Tauri to be available
        let attempts = 0;
        while (!window.__TAURI__ && attempts < 50) {
          await new Promise((r) => setTimeout(r, 100));
          attempts++;
        }

        if (window.__TAURI__) {
          init();
        } else {
          console.error("[Launcher] Tauri not available");
          // Show launcher anyway
          document.getElementById("launcher").classList.remove("hidden");
        }
      }

      startInit();
    </script>
  </body>
</html>
