<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Music Assistant Companion App</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root,
      :root.light {
        --bg-primary: #f5f5f7;
        --text-primary: #1d1d1f;
        --text-secondary: #555558;
        --border-color: #d2d2d7;
        --accent-color: #007aff;
        --accent-hover: #0056b3;
      }

      :root.dark {
        --bg-primary: #1c1c1e;
        --text-primary: #f5f5f7;
        --text-secondary: #aeaeb2;
        --border-color: #38383a;
        --accent-color: #0a84ff;
        --accent-hover: #409cff;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
        text-align: center;
      }

      main {
        width: 100%;
        max-width: 320px;
      }

      .logo {
        width: 96px;
        height: 96px;
        margin-bottom: 18px;
        border-radius: 20px;
      }

      h1 {
        font-size: 22px;
        font-weight: 600;
        line-height: 1.25;
      }

      .website,
      .release-notes {
        display: inline-block;
        color: var(--accent-color);
        font-size: 13px;
        line-height: 1.4;
        user-select: text;
      }

      .website {
        margin-top: 9px;
      }

      .website:hover,
      .release-notes:hover {
        color: var(--accent-hover);
      }

      .website:focus-visible,
      .release-notes:focus-visible {
        outline: 2px solid var(--accent-color);
        outline-offset: 2px;
      }

      .version {
        margin-top: 7px;
        color: var(--text-secondary);
        font-size: 13px;
      }

      .release-notes {
        margin-top: 7px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="logo.png" alt="" class="logo" />
      <h1 data-i18n="desktop.about.app_name">Music Assistant Companion App</h1>
      <a
        class="website"
        href="https://www.music-assistant.io/"
        target="_blank"
        rel="noopener noreferrer"
        >https://www.music-assistant.io/</a
      >
      <div class="version" id="version">Version</div>
      <a
        class="release-notes"
        id="release-notes"
        data-i18n="desktop.about.release_notes"
        href="https://github.com/music-assistant/desktop-app/releases"
        target="_blank"
        rel="noopener noreferrer"
        >Release notes</a
      >
    </main>

    <script src="i18n.js"></script>
    <script src="logging.js"></script>
    <script src="about.js"></script>
  </body>
</html>
