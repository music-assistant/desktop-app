name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., 0.4.4)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ensure-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout full history for release range
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_TAG: ${{ inputs.tag }}
        run: |
          TAG="${RAW_TAG#v}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse --verify --end-of-options "refs/tags/$TAG^{commit}")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Existing release tag does not match the build commit. Run the workflow at that tag."
              exit 1
            fi
            echo "Release $TAG already exists; preserving its notes."
            exit 0
          fi
          NOTES_FILE="$(mktemp)"
          python3 .github/scripts/generate-release-notes.py \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG" --target "$GITHUB_SHA" --output "$NOTES_FILE"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file "$NOTES_FILE"

  build:
    needs: ensure-release
    permissions:
      contents: write
    uses: ./.github/workflows/build-packages.yml
    with:
      tag: ${{ inputs.tag }}
      upload_release_assets: true
    secrets: inherit

  update-homebrew:
    name: Update Homebrew tap
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Create Homebrew tap token
        id: tap_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MUSIC_ASSISTANT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MUSIC_ASSISTANT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Trigger Homebrew tap update
        env:
          GH_TOKEN: ${{ steps.tap_token.outputs.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository_owner }}/homebrew-tap/dispatches" \
            -f "event_type=update-cask" \
            -f "client_payload[version]=$RELEASE_TAG"
