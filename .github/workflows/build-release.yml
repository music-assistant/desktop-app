name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., 0.4.4)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ensure-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_TAG: ${{ inputs.tag }}
        run: |
          TAG="${RAW_TAG#v}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "Release $TAG"

  build:
    needs: ensure-release
    permissions:
      contents: write
    uses: ./.github/workflows/build-packages.yml
    with:
      tag: ${{ inputs.tag }}
      upload_release_assets: true
    secrets: inherit

  update-homebrew:
    name: Update Homebrew tap
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Create Homebrew tap token
        id: tap_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MUSIC_ASSISTANT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MUSIC_ASSISTANT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Trigger Homebrew tap update
        env:
          GH_TOKEN: ${{ steps.tap_token.outputs.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository_owner }}/homebrew-tap/dispatches" \
            -f "event_type=update-cask" \
            -f "client_payload[version]=$RELEASE_TAG"
